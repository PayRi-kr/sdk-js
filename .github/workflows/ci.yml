name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate SDK types from OpenAPI
        run: pnpm --filter @payri/sdk generate
      - name: Check generated SDK types
        run: git diff --exit-code packages/sdk/src/generated
      - run: pnpm --filter "@payri/*" build
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
